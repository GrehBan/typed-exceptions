[project]
name = "typed-exceptions"
version = "0.2.1"
description = "Exceptions with typed, structured context and message templates"
keywords = [
    "exceptions",
    "typed exceptions",
    "structured exceptions",
    "message templates",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
license = "MIT"
authors = [
    { name = "GrehBan", email = "maximfeedback19@gmail.com" },
]
maintainers = [
    { name = "GrehBan", email = "maximfeedback19@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "ruff>=0.17.4",
]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 79
src = ["src", "tests"]
target-version = "py314"
exclude = [
    ".git",
    "build",
    "dist",
    "venv",
    ".venv",
    "docs",
    "dev",
    "scripts",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "C4",  # flake8-comprehensions
    "C90", # mccabe complexity
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "I",   # isort
    "UP",  # pyupgrade
    "T10", # flake8-debugger
    "D",   # pydocstyle
]
ignore = [
    "UP040",
    "UP046"
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["typed_exceptions"]

[tool.hatch.build.targets.wheel]
packages = ["src/typed_exceptions"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/typed_exceptions",
    "pyproject.toml",
    "README.md",
    ".python-version",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["typed_exceptions"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_packages = ["typed_exceptions"]

[[tool.importlinter.contracts]]
name = "Package layers"
type = "layers"
layers = [
    "typed_exceptions.exception",
    "typed_exceptions.template",
    "typed_exceptions.field",
    "typed_exceptions.access",
    "typed_exceptions.introspection",
    "typed_exceptions.sentinel",
]
ignore_imports = [
    "typed_exceptions.template -> typed_exceptions.exception",
]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = false
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
follow_imports_for_stubs = true
namespace_packages = true
show_absolute_path = true
